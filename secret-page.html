<!DOCTYPE html>
<html>
  <head>
		<title>Shhhh secret page</title>
		<link rel="stylesheet" href="secret-page.css">
		<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anonymous+Pro:ital,wght@0,400;0,700;1,400;1,700&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Pixelify+Sans:wght@400..700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
	</head>
	<body>
		<div class="noise-overlay" aria-hidden="true"></div>
    <div class="page-1">
			<p class="congrats">CONGRATS YOU HAVE FOUND THE SECRET PAGE!!.Now take a moment to congragulate yourself you deserve it. Now obviously you worked hard for this secret page so here you go a gift.</p>
		</div>
		<div class="images-page">
    <img class="pfp" src="./images/jungle-umer.png">
		<img class="pfp-2" src="./images/chinese-umer.png">
		<img class="pfp-3" src="./images/bathrooom-umer.png">
		<img class="pfp-4" src="./images/crazy-umer.png">
		</div>
		<script>
			const CONFETTI_COLORS = ["#ff3b30", "#ff9500", "#ffcc00", "#34c759", "#00c7be", "#007aff", "#af52de", "#ff2d55"];
			const PIECE_COUNT = 120;

			function rand(min, max) {
				return Math.random() * (max - min) + min;
			}

			for (let i = 0; i < PIECE_COUNT; i++) {
				const piece = document.createElement("div");
				piece.className = "confetti";

				const size = rand(6, 12);
				const duration = rand(3, 7);
				const delay = rand(0, 4);

				piece.style.left = rand(-5, 105) + "vw";
				piece.style.width = size + "px";
				piece.style.height = size + "px";
				piece.style.background = CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)];
				piece.style.animationDuration = duration + "s";
				piece.style.animationDelay = "-" + delay + "s";

				document.body.appendChild(piece);
			}
		</script>
	</body>
</html>
